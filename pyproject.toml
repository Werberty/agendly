[project]
name = "agendly"
version = "0.1.0"
description = ""
authors = [
    {name = "Werberty",email = "werberty.alexandre@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "django-phonenumber-field[phonenumberslite] (>=8.5.0,<9.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "django-debug-toolbar (>=8.0.0,<9.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "detect-secrets (>=1.5.0,<2.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "django-stubs (>=6.1.2,<7.0.0)",
    "djangorestframework-stubs (>=3.18.1,<4.0.0)",
    "ruff (>=0.17.2,<0.18.0)"
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100
target-version = "py314"
force-exclude = true
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR"
no_implicit_optional = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["environ.*", "phonenumber_field.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
