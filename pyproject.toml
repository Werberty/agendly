[project]
name = "agendly"
version = "0.1.0"
description = ""
authors = [
    {name = "Werberty",email = "werberty.alexandre@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "django-phonenumber-field[phonenumberslite] (>=8.5.0,<9.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "django-debug-toolbar (>=8.0.0,<9.0.0)"
]

[tool.poetry]
package-mode = false
