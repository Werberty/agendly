name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  POETRY_VERSION: "2.4.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-secret-key # pragma: allowlist secret
      DATABASE_URL: postgres://agendly:agendly@localhost:5432/agendly # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Instalar dependências
        run: poetry install --no-root

      - name: Cache do pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Rodar pre-commit
        run: poetry run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agendly
          POSTGRES_PASSWORD: agendly # pragma: allowlist secret
          POSTGRES_DB: agendly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agendly -d agendly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-secret-key # pragma: allowlist secret
      DATABASE_URL: postgres://agendly:agendly@localhost:5432/agendly # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Instalar dependências
        run: poetry install --no-root

      - name: Verificar migrations pendentes
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Rodar testes
        run: poetry run pytest --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Guardar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
